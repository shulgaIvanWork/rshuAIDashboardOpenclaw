<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>План-факт выручки</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/ui-kit/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="ds-topbar">
  <a href="/dashboards" aria-label="Все дашборды"><img class="ds-topbar__logo" src="/ui-kit/logo-white.svg" alt="Российская школа управления"></a>
  <div class="ds-topbar__nav" style="margin-left:auto">
    <a href="/dashboards" class="ds-topbar__link" title="Все дашборды">
      <svg class="ds-icon" aria-hidden="true"><use href="/ui-kit/icons.svg#i-dashboard"></use></svg><span class="ds-topbar__label">Все дашборды</span>
    </a>
  </div>
</nav>
<main class="ds-page pf-page">
  <div class="ds-page-head">
    <div>
      <h1 class="ds-title">План-факт выручки</h1>
      <p class="ds-subtitle" id="updateDate"></p>
    </div>
    <a href="guide.pdf" download class="btn-guide">
      <svg class="ds-icon" aria-hidden="true"><use href="/ui-kit/icons.svg#i-file"></use></svg>Инструкция
    </a>
  </div>

  <div class="tabs pf-tabs" id="tabBar">
    <button class="tab active" type="button" data-tab="weekly">По неделям</button>
    <button class="tab" type="button" data-tab="post">Пост/Выр/Уч</button>
    <button class="tab" type="button" data-tab="om">Выручка ОМ</button>
    <button class="tab" type="button" data-tab="sdo">Выручка СДО</button>
  </div>

  <div class="ds-card pf-card">
    <div id="tabContent" class="table-responsive">
      <div class="text-center text-secondary py-5">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div>Расчёт данных из Bitrix24…</div>
      </div>
    </div>
  </div>
</main>

<script src="/shared.js"></script>
<script src="app.js"></script>
</body>
</html>
