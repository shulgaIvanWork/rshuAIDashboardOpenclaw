<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Участники 2026</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container-fluid p-2">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0">Участники 2026 <span id="updateDate" class="fs-6 fw-normal text-secondary"></span></h1>
    <a href="/api/export" id="exportBtn" class="btn btn-success btn-sm rounded-3" download>📥 Скачать Excel (2 листа)</a>
  </div>

  <ul class="nav nav-tabs mb-3" id="tabBar">
    <li class="nav-item">
      <button class="nav-link active tab" data-tab="participants" id="participantsTitle">👥 предыдущая неделя</button>
    </li>
    <li class="nav-item">
      <button class="nav-link tab" data-tab="participantsCur" id="participantsCurTitle">👥 текущая неделя</button>
    </li>
  </ul>

  <div id="participantsArea" class="tab-area active">
    <div>
        <div id="participantsDirections" class="mb-3"></div>
        <div id="participantsTableWrap" class="table-responsive">
          <div class="text-center text-secondary py-5">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div>Загрузка участников…</div>
          </div>
        </div>
    </div>
  </div>

  <div id="participantsCurArea" class="tab-area d-none">
    <div>
        <div id="participantsCurDirections" class="mb-3"></div>
        <div id="participantsCurTableWrap" class="table-responsive">
          <div class="text-center text-secondary py-5">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div>Загрузка участников…</div>
          </div>
        </div>
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script src="app.js"></script>
</body>
</html>
