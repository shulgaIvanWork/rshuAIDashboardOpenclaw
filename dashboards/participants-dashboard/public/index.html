<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Участники 2026</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/ui-kit/ds.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="ds-topbar">
  <a href="/dashboards" aria-label="Все дашборды"><img class="ds-topbar__logo" src="/ui-kit/logo-white.svg" alt="Российская школа управления"></a>
  <div class="ds-topbar__nav" style="margin-left:auto">
    <a href="/dashboards" class="ds-topbar__link" title="Все дашборды">
      <svg class="ds-icon" aria-hidden="true"><use href="/ui-kit/icons.svg#i-dashboard"></use></svg><span class="ds-topbar__label">Все дашборды</span>
    </a>
  </div>
</nav>
<main class="ds-page pt-page">
  <div class="ds-page-head">
    <div>
      <h1 class="ds-title">Участники 2026</h1>
      <p class="ds-subtitle" id="updateDate"></p>
    </div>
    <div class="ds-row">
      <a href="guide.pdf" download class="btn-guide">
        <svg class="ds-icon" aria-hidden="true"><use href="/ui-kit/icons.svg#i-file"></use></svg>Инструкция
      </a>
      <a href="/api/export" id="exportBtn" class="btn-excel" download>
        <svg class="ds-icon" aria-hidden="true"><use href="/ui-kit/icons.svg#i-download"></use></svg>Скачать Excel
      </a>
    </div>
  </div>

  <div class="ds-card pt-filters">
    <label for="weekSelect" class="ds-label">Неделя:</label>
    <select id="weekSelect" class="ds-select"></select>
    <label for="dirSelect" class="ds-label pt-filters__gap">Направление:</label>
    <select id="dirSelect" class="ds-select"></select>
  </div>

  <div id="participantsArea" class="ds-card pt-table-card">
    <div id="participantsTableWrap" class="table-responsive">
      <div class="text-center text-secondary py-5">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div>Загрузка участников…</div>
      </div>
    </div>
  </div>
</main>

<script src="/shared.js"></script>
<script src="app.js"></script>
</body>
</html>
