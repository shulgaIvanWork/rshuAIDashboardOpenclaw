<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Участники 2026</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container-fluid p-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0">Участники 2026 <span id="updateDate" class="fs-6 fw-normal text-secondary"></span></h1>
    <a href="/api/export" id="exportBtn" class="btn btn-success btn-sm rounded-3" download>📥 Скачать Excel</a>
  </div>

  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <label for="weekSelect" class="mb-0 fw-semibold">Неделя:</label>
    <select id="weekSelect" class="form-select form-select-sm w-auto"></select>
    <label for="dirSelect" class="mb-0 fw-semibold ms-2">Направление:</label>
    <select id="dirSelect" class="form-select form-select-sm w-auto"></select>
  </div>

  <div id="participantsArea">
    <div>
        <div id="participantsTableWrap" class="table-responsive">
          <div class="text-center text-secondary py-5">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div>Загрузка участников…</div>
          </div>
        </div>
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script src="app.js"></script>
</body>
</html>
