<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Участники 2026</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>Участники 2026 <span id="updateDate" class="page-title-meta"></span></h1>

  <div class="tabs" id="tabBar">
    <div class="tab active" data-tab="participants">👥 Участники прошлой недели</div>
    <div class="tab" data-tab="participantsCur">👥 Участники текущей недели</div>
  </div>

  <div id="participantsArea" class="tab-area active">
      <h2 id="participantsTitle">Участники Очно / Онлайн за прошлую неделю</h2>
      <div id="participantsTableWrap" style="overflow-x:auto">
        <div class="loading-state"><div class="spinner"></div><div>Загрузка участников…</div></div>
      </div>
  </div>

  <div id="participantsCurArea" class="tab-area">
      <h2 id="participantsCurTitle">👥 Участники Очно / Онлайн за текущую неделю</h2>
      <div id="participantsCurTableWrap" style="overflow-x:auto">
        <div class="loading-state"><div class="spinner"></div><div>Загрузка участников…</div></div>
      </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
