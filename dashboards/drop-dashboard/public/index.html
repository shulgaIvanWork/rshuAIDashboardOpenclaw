<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашборд отдела продаж РШУ 2026</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/range-calendar/range-calendar.css">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="/vendor/range-calendar/range-calendar.js"></script>
  <script src="/shared.js" defer></script>
  <!-- app.js разбит на модули (<script defer>, общий global-scope). Порядок важен:
       core → data → render → boot (boot запускает loadAll() последним). -->
  <script src="app-core.js" defer></script>
  <script src="app-data.js" defer></script>
  <script src="app-render.js" defer></script>
  <script src="app-boot.js" defer></script>
</head>
<body>
<div class="container-fluid p-4">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h1 class="mb-0">Дашборд отдела продаж РШУ 2026 <span id="updateDate" class="page-title-meta"></span></h1>
    <a href="guide.pdf" download class="btn-guide">📄 Инструкция</a>
  </div>
  <div class="date-filter-bar">
    <div class="date-filter-group">
      <div class="date-filter-row">
        <label>📅 Период:</label>
        <input type="text" id="periodDisplay" class="rc-input" readonly autocomplete="off">
        <input type="hidden" id="dateFrom">
        <input type="hidden" id="dateTo">
      </div>
      <div id="filterInfo" class="filter-info"></div>
    </div>
    <div class="date-filter-group">
      <div class="date-filter-row">
        <label>🔁 Сравнить с:</label>
        <input type="text" id="compareDisplay" class="rc-input" readonly autocomplete="off">
        <input type="hidden" id="compareFrom">
      </div>
      <div class="filter-info">(по умолчанию — предыдущий период той же длины; можно задать свою дату начала)</div>
    </div>
  </div>
  <div id="contentAreaNew">
    <div class="text-center text-secondary py-5" id="loadingStateNew"><div class="spinner-border text-primary mb-2" role="status"></div><div>Загрузка данных…</div></div>
  </div>
</div>
</body>
</html>
