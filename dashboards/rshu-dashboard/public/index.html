<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашборд продаж 2026</title>
  <script>
var _p = window.location.pathname;
var _m = _p.match(/^\/([^/]+)\//);
window.BASE_PATH = _m ? '/' + _m[1] : '';

async function safeFetch(url, opts) {
  var resp = await fetch(url, opts);
  if (resp.redirected || resp.url.endsWith('/login')) { window.location.href = '/login'; throw new Error('redirect'); }
  var text = await resp.text();
  if (text.startsWith('<!DOCTYPE')) { window.location.href = '/login'; throw new Error('redirect'); }
  return JSON.parse(text);
}
</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F7F8FA; padding: 24px; color: #0F172A; }
    .wrap { max-width: 1500px; margin: 0 auto; }
    h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; }
    .sub { color: #475569; font-size: 13px; margin-bottom: 24px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .toolbar button { background: #093EB4; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: .2s; }
    .toolbar button:hover { background: #3079D2; }
    .toolbar button:disabled { background: #475569; cursor: wait; }
    .page-title-meta { font-size: 13px; font-weight: 400; color: #888; }

    .kpis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi { background: #fff; border-radius: 8px; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .kpi .lbl { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 4px; }
    .kpi .val { font-size: 18px; font-weight: 700; margin: 4px 0 2px; color: #0F172A; }
    .kpi .sub { font-size: 12px; color: #475569; margin: 0; }
    .kpi .val-big { font-size: 21px; font-weight: 700; }
    .kpi .si { font-size: 12px; color: #475569; font-weight: 400; }
    .kpi .lbl2 { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: .3px; margin: 4px 0; }
    .kpi .row { display: flex; justify-content: space-between; align-items: baseline; }
    .kpi-total { background-color: rgba(31, 42, 68, 0.08) !important; }
    .kpi-oom { background-color: rgba(0, 188, 212, 0.12) !important; }
    .kpi-kom { background-color: rgba(156, 39, 176, 0.12) !important; }
    .kpi-reg { background-color: rgba(76, 175, 80, 0.12) !important; }
    .c-total { color: #1f2a44 !important; }
    .c-oom { color: #00bcd4 !important; }
    .c-kom { color: #9C27B0 !important; }
    .c-reg { color: #4CAF50 !important; }
    .kpi-header { grid-column: 1 / -1; font-size: 15px; font-weight: 700; margin: 4px 0; }
    .delta-up { color: #2E7D32; font-size: 12px; }
    .delta-down { color: #C62828; font-size: 12px; }
    .delta-flat { color: #475569; font-size: 12px; }

    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card.kom { border-left: 4px solid #7A2E2E; }
    .card h2 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
    .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .chartbox { height: 340px; position: relative; }
    .chartbox-sm { height: 240px; position: relative; }
    .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .threecol { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #093EB4; color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
    td { padding: 8px 12px; border-bottom: 1px solid #E2E8F0; }
    tr:hover td { background: #F1F3F6; }
    tr.cur td { background: #F1F3F6; font-weight: 600; }
    .scroll-x { overflow-x: auto; }
    .loading-state { padding: 60px; text-align: center; color: #475569; }
    .loading-state .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top-color: #093EB4; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { padding: 40px; text-align: center; color: #C62828; }
    .dt { font-size: 11px; color: #475569; font-weight: 400; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    th.sort { cursor: pointer; user-select: none; }
    th.sort:hover { background: #3079D2; }
    th.sort::after { content: ' ⇅'; font-size: 10px; opacity: .4; font-weight: 400; }
    th.sort.asc::after { content: ' ▲'; opacity: 1; }
    th.sort.desc::after { content: ' ▼'; opacity: 1; }
    .badge-prev { display:inline-block; background:#E8F5E9; color:#2E7D32; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-left:4px }
    .badge-new { display:inline-block; background:#FFF3E0; color:#E65100; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-left:4px }
    .tdleft { text-align: left; }
    .tdright { text-align: right; }
    .deal-title { font-weight: 600; }
    .muted { color: #475569; font-size: 11px; }
    @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } .twocol, .threecol { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<a href="guide.pdf" download title="Скачать инструкцию (PDF)" style="position:fixed;top:10px;right:12px;z-index:2000;background:#eef1f8;color:#093EB4;border:1px solid #093EB4;padding:6px 14px;border-radius:8px;font:600 13px/1 system-ui,-apple-system,sans-serif;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.18)">📄 Инструкция</a>
<div class="wrap">
  <h1>📊 Дашборд продаж 2026 <span id="updateDate" class="page-title-meta"></span></h1>
  <p class="sub" id="sourceInfo">Источник: Битрикс24</p>
  <div class="toolbar">
    <div class="period-group" id="periodGroup">
      <button data-period="week" class="active">Неделя</button>
      <button data-period="month">Месяц</button>
    </div>
    <button id="aprilTabBtn" class="tab-btn">📋 Май (итоги)</button>
    <button id="forecastTabBtn" class="tab-btn alt">🔮 Июнь (прогноз)</button>
    <button id="productsTabBtn" class="tab-btn">⭐ Рейтинг продуктов</button>
    <button id="refreshBtn" style="background:#093EB4;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500">🔄 Обновить данные</button>
  </div>
  <div id="contentArea">
    <div class="loading-state" id="loadingState"><div class="spinner"></div><div>Загрузка данных…</div></div>
  </div>
</div>

<script>
let overviewData = null;
let currentPeriod = 'week';
let chartInstances = {};

async function api(path) {
  const r = await fetch((window.BASE_PATH || '') + path);
  return r.json();
}

function periodLabel(key, period) {
  if (period === 'month') {
    const m = key % 100;
    const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    return months[m - 1] || key;
  }
  return 'W' + String(key).padStart(2, '0');
}

function periodDateRange(row, period) {
  if (period === 'month') {
    const m = row.key % 100;
    const y = Math.floor(row.key / 100);
    return new Date(y, m - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  }
  // неделя
  const mon = new Date(2026, 0, 1 + (row.key - 1) * 7);
  const monStr = mon.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
  return `${monStr} – ${sun.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}`;
}

async function loadAll(period) {
  const area = document.getElementById('contentArea');

  try {
    const status = await api('/api/status');
    const dateEl = document.getElementById('updateDate');
    if (dateEl && status.loadedAt) {
      const dt = new Date(status.loadedAt);
      dateEl.textContent = '(Данные на: ' + dt.toLocaleDateString('ru-RU') + ' ' + dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ')';
    }

    overviewData = await api(`/api/overview?period=${period}`);
    renderPage(overviewData, period);
    drawCharts(overviewData.periods || [], period);
  } catch (e) {
    area.innerHTML = `<div class="error-state">❌ Ошибка: ${e.message}</div>`;
  }
}

function renderPage(data, period) {
  const area = document.getElementById('contentArea');
  const periods = data.periods || [];
  const k = data.kpi || {};
  const carry = data.carryOver || { cnt: 0, sum: 0 };
  const mgrs = data.topManagers || [];

  // Созданные за всё время
  const totalCreated = periods.reduce((s, p) => s + (p.createdCnt || 0), 0);

  area.innerHTML = `
    <div class="kpis" id="kpiContainer"></div>

    <!-- Виджет: переходящий остаток + создано за период -->
    <div class="widget-inwork" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card" style="background:linear-gradient(135deg,#e3f2fd,#bbdefb);border-left:5px solid #1565C0;padding:24px">
        <div style="font-size:13px;color:#1565C0;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">📋 В работе на начало периода</div>
        <div style="font-size:42px;font-weight:800;color:#0D47A1;margin:4px 0">${(carry.cnt || 0).toLocaleString()}</div>
        <div style="font-size:16px;color:#1565C0;">сделок на сумму ${(carry.sum || 0).toLocaleString()} ₽</div>
        <div style="font-size:11px;color:#6a7a9a;margin-top:4px">на 30.04.2026</div>
      </div>
      <div class="card" style="background:linear-gradient(135deg,#f3e5f5,#e1bee7);border-left:5px solid #9C27B0;padding:24px">
        <div style="font-size:13px;color:#9C27B0;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">📊 Объём воронки</div>
        <div style="font-size:42px;font-weight:800;color:#6A1B9A;margin:4px 0">${((carry.cnt || 0) + (data.totalCreatedCnt || 0)).toLocaleString()}</div>
        <div style="font-size:16px;color:#9C27B0;">сделок на сумму ${((carry.sum || 0) + (data.totalCreatedSum || 0)).toLocaleString()} ₽</div>
        <div style="font-size:11px;color:#6a7a9a;margin-top:4px">в работе на начало + создано в периоде</div>
      </div>
      <div class="card" style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-left:5px solid #2E7D32;padding:24px">
        <div style="font-size:13px;color:#2E7D32;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">➕ Создано за период</div>
        <div style="font-size:42px;font-weight:800;color:#1B5E20;margin:4px 0">${(totalCreated || 0).toLocaleString()}</div>
        <div style="font-size:16px;color:#2E7D32;">новых сделок в выбранных воронках</div>
      </div>
    </div>

    <div class="card"><h2>Поступления по ${period === 'month' ? 'месяцам' : 'неделям'}</h2><div class="chartbox"><canvas id="wonChart"></canvas></div></div>
    <div class="twocol">
      <div class="card"><h2>Количество сделок</h2><div class="chartbox"><canvas id="cntChart"></canvas></div></div>
      <div class="card"><h2>Средний чек</h2><div class="chartbox"><canvas id="avgChart"></canvas></div></div>
    </div>
    <div class="card">
      <h2>Детализация по ${period === 'month' ? 'месяцам' : 'неделям'}</h2>
      <div class="scroll-x"><table id="detailTable">
        <thead><tr>
          <th>${period === 'month' ? 'Месяц' : 'Неделя'}</th>
          <th>Период</th>
          <th>В работе (нач.)</th>
          <th>Создано</th>
          <th>Сумма созданных</th>
          <th>Оплачено</th>
          <th>Сумма поступлений</th>
          <th>Ср. чек</th>
          <th>Проиграно</th>
          <th>Конверсия</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
    <div class="twocol">
      <div class="card"><h3>🏆 Топ менеджеров (оплаченные)</h3><div class="scroll-x"><table id="managersTable"><thead><tr><th>#</th><th>Менеджер</th><th>Оплат</th><th>Сумма</th></tr></thead><tbody></tbody></table></div></div>
      <div class="card"><h3>📈 Поступления (последние 5 ${period === 'month' ? 'мес.' : 'нед.'})</h3><div class="chartbox"><canvas id="miniChart"></canvas></div></div>
    </div>
  `;

  renderKPI(k);
  renderDetailTable(periods, period);
  renderManagers(mgrs);
}

function renderKPI(k) {
  const c = document.getElementById('kpiContainer');
  if (!c) return;
  c.innerHTML = `
    <div class="kpi"><div class="label">Поступления</div><div class="val">${(k.paid_sum||0).toLocaleString()} ₽</div><div class="sub">${k.paid_cnt||0} оплат</div></div>
    <div class="kpi"><div class="label">Средний чек</div><div class="val">${Math.round(k.avgCheck||0).toLocaleString()} ₽</div></div>
    <div class="kpi"><div class="label">Конверсия</div><div class="val">${(k.conversion||0).toFixed(1)}%</div></div>
    <div class="kpi"><div class="label">Создано в 2026</div><div class="val">${(k.created_sum||0).toLocaleString()} ₽</div><div class="sub">${k.created_cnt||0} новых</div></div>
    <div class="kpi"><div class="label">Лучший период</div><div class="val">${k.bestLabel || '—'}</div><div class="sub">${(k.bestSum||0).toLocaleString()} ₽</div></div>
    <div class="kpi"><div class="label">Текущий период</div><div class="val">${(k.lastSum||0).toLocaleString()} ₽</div><div class="sub">${k.lastCnt||0} оплат <span class="delta ${k.delta>=0?'pos':'neg'}">${k.delta>=0?'↑':'↓'} ${Math.abs(k.delta).toFixed(1)}%</span></div></div>
  `;
}

function renderDetailTable(periods, period) {
  const tbody = document.querySelector('#detailTable tbody');
  if (!tbody) return;
  if (!periods || !periods.length) { tbody.innerHTML = '<tr><td colspan="10" class="loading-state">Нет данных</td></tr>'; return; }
  tbody.innerHTML = periods.map(p => {
    const avg = p.paidCnt ? (p.paidSum / p.paidCnt).toFixed(0) : 0;
    const conv = (p.paidCnt + p.lostCnt) ? ((p.paidCnt / (p.paidCnt + p.lostCnt)) * 100).toFixed(1) : 0;
    return `<tr>
      <td><strong>${p.label}</strong></td>
      <td style="font-size:12px;color:#6a7a9a">${periodDateRange(p, period)}</td>
      <td><strong>${p.inWorkStartCnt}</strong></td>
      <td>${p.createdCnt}</td>
      <td>${(p.createdSum||0).toFixed(0)}</td>
      <td>${p.paidCnt}</td>
      <td><strong>${(p.paidSum||0).toFixed(0)}</strong></td>
      <td>${avg}</td>
      <td>${p.lostCnt}</td>
      <td>${conv}%</td>
    </tr>`;
  }).join('');
}

function renderManagers(mgrs) {
  const tbody = document.querySelector('#managersTable tbody');
  if (!tbody) return;
  if (!mgrs || !mgrs.length) { tbody.innerHTML = '<tr><td colspan="4" class="loading-state">Нет данных</td></tr>'; return; }
  tbody.innerHTML = mgrs.slice(0, 20).map((m, i) => `<tr><td>${i+1}</td><td>${m.name}</td><td>${m.cnt}</td><td>${(m.sum||0).toLocaleString()} ₽</td></tr>`).join('');
}

function destroyChart(key) {
  if (chartInstances[key]) { chartInstances[key].destroy(); delete chartInstances[key]; }
}

function drawCharts(periods, period) {
  if (!periods || !periods.length) return;
  const labels = periods.map(p => p.label);
  const paidSum = periods.map(p => p.paidSum || 0);
  const paidCnt = periods.map(p => p.paidCnt || 0);
  const lostCnt = periods.map(p => p.lostCnt || 0);
  const avgData = periods.map(p => p.paidCnt ? (p.paidSum || 0) / p.paidCnt : 0);
  const last5 = periods.slice(-5);
  const common = { responsive: true, maintainAspectRatio: false };

  document.querySelectorAll('canvas').forEach(c => {
    destroyChart(c.id);
    if (c.id === 'wonChart') {
      chartInstances.won = new Chart(c, {
        type: 'bar', data: { labels, datasets: [{ label: 'Поступления, ₽', data: paidSum, backgroundColor: '#3B6EA5', borderRadius: 4 }] },
        options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    } else if (c.id === 'cntChart') {
      chartInstances.cnt = new Chart(c, {
        type: 'bar', data: { labels, datasets: [
          { label: 'Оплачено', data: paidCnt, backgroundColor: '#2E7D32', borderRadius: 4 },
          { label: 'Проиграно', data: lostCnt, backgroundColor: '#C62828', borderRadius: 4 }
        ]},
        options: { ...common, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
      });
    } else if (c.id === 'avgChart') {
      chartInstances.avg = new Chart(c, {
        type: 'line', data: { labels, datasets: [{ label: 'Средний чек, ₽', data: avgData, borderColor: '#E67E22', backgroundColor: 'rgba(200,164,92,0.1)', fill: true, tension: 0.3, pointRadius: 3 }] },
        options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    } else if (c.id === 'miniChart') {
      chartInstances.mini = new Chart(c, {
        type: 'line', data: { labels: last5.map(p => p.label), datasets: [{ label: 'Поступления, ₽', data: last5.map(p => p.paidSum || 0), borderColor: '#3B6EA5', backgroundColor: 'rgba(31,42,68,0.08)', fill: true, tension: 0.3, pointRadius: 4 }] },
        options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }
  });
}

// --- Экспорт ---
// --- Экспорт удалён (неактуален)

// --- Переключение периода ---
document.getElementById('periodGroup').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.period) return;
  const period = btn.dataset.period;
  if (period === currentPeriod) return;

  this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = period;
  loadAll(period);
});

// --- Обновление ---
document.getElementById('refreshBtn').addEventListener('click', async function() {
  this.disabled = true; this.textContent = '⏳ Обновление...';
  const area = document.getElementById('contentArea');
  area.innerHTML = `<div class="loading-state"><div class="spinner"></div><div id="refreshStatus">Загрузка данных из Битрикс24…<br><small style="color:#6a7a9a">0 сделок получено</small></div></div>`;

  try {
    await fetch((window.BASE_PATH || '') + '/api/refresh', { method: 'POST' });
    while (true) {
      await new Promise(r => setTimeout(r, 2000));
      const s = await api('/api/status');
      document.getElementById('refreshStatus').innerHTML =
        s.loading
          ? `Загрузка данных из Битрикс24…<br><small style="color:#6a7a9a">${s.dealsCount || 0} сделок получено</small>`
          : `Готово! ${s.dealsCount || 0} сделок, ${s.carryOverCount || 0} в остатке`;
      if (s.ready) break;
      if (s.error) { throw new Error(s.error); }
    }
    window.location.reload();
  } catch(e) {
    area.innerHTML = `<div class="error-state">❌ Ошибка: ${e.message}</div>`;
  }
  this.disabled = false; this.textContent = '🔄 Обновить данные';
});

// ===== ВКЛАДКА «Апрель» =====

let aprilData = null;

function renderAprilPage(data) {
  const area = document.getElementById('contentArea');
  const periods = data.periods || [];
  const carry = data.carryOver || { cnt: 0, sum: 0 };
  const mgrs = data.topManagers || [];

  // Лучшая неделя
  let bestLabel = null, bestSum = 0;
  for (const p of periods) if ((p.paidSum || 0) > bestSum) { bestLabel = p.label; bestSum = p.paidSum || 0; }
  // Дельта последней недели
  const last = periods[periods.length - 1] || {};
  const prev = periods[periods.length - 2] || null;
  const delta = prev ? (((last.paidSum || 0) - (prev.paidSum || 0)) / ((prev.paidSum || 1))) * 100 : 0;

  area.innerHTML = `
    <div class="kpis" id="kpiApril">
      <div class="kpi" style="border-top-color:#1565C0"><div class="label">Поступления в периоде</div><div class="val">${(data.totalPaidSum||0).toLocaleString()} ₽</div><div class="sub">${data.totalPaidCnt||0} оплат ${data.paidSumDelta > 0 ? "↑" : data.paidSumDelta < 0 ? "↓" : ""} ${Math.abs(data.paidSumDelta || 0).toFixed(1)}%</div></div>
      <div class="kpi"><div class="label">Средний чек</div><div class="val">${Math.round(data.avgCheck||0).toLocaleString()} ₽</div><div class="sub">${data.avgCheckDelta > 0 ? '↑' : data.avgCheckDelta < 0 ? '↓' : ''} ${Math.abs(data.avgCheckDelta || 0).toFixed(1)}% к прошлому месяцу</div></div>

function drawAprilDailyChart(dailyData) {
  const canvas = document.getElementById('dailyChartApril');
  if (!canvas || !dailyData || !dailyData.length) return;
  if (chartInstances.dailyChartApril) { chartInstances.dailyChartApril.destroy(); delete chartInstances.dailyChartApril; }

  // Оттенки синего для каждой недели
  const weekColors = {
    14: '#1565C0',  // тёмно-синий
    15: '#1E88E5',  // синий
    16: '#42A5F5',  // голубой
    17: '#64B5F6',  // светло-голубой
    18: '#90CAF9',  // очень светло
    19: '#BBDEFB',  // бледно
  };
  const weekBorderColors = {
    14: '#0D47A1',
    15: '#1565C0',
    16: '#1976D2',
    17: '#1E88E5',
    18: '#2196F3',
    19: '#42A5F5',
  };

  const labels = dailyData.map(d => {
    const day = d.monthDay;
    const wk = d.weekNum;
    return day + '\nW' + wk;
  });
  const paidSum = dailyData.map(d => d.paidSum || 0);
  const paidCnt = dailyData.map(d => d.paidCnt || 0);
  const bgColors = dailyData.map(d => weekColors[d.weekNum] || '#1565C0');
  const borderColors = dailyData.map(d => weekBorderColors[d.weekNum] || '#0D47A1');

  // Общая статистика
  const totalSum = paidSum.reduce((s, v) => s + v, 0);
  const totalCnt = paidCnt.reduce((s, v) => s + v, 0);
  document.getElementById('dailyStatsApril').textContent =
    `Всего за период: ${totalSum.toLocaleString()} ₽ · ${totalCnt} оплат`;

  chartInstances.dailyChartApril = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Поступления, ₽',
        data: paidSum,
        backgroundColor: bgColors,
        borderColor: borderColors,
        borderWidth: 1,
        borderRadius: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const idx = ctx.dataIndex;
              const cnt = paidCnt[idx] || 0;
              const sum = ctx.raw || 0;
              return sum.toLocaleString() + ' ₽ (' + cnt + ' оплат)';
            }
          }
        },
        datalabels: {
          anchor: 'end',
          align: 'end',
          color: '#1a237e',
          font: { weight: 'bold', size: 9 },
          formatter: function(value) {
            if (!value) return '';
            return (value / 1000).toFixed(0) + 'k';
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 9 }, maxRotation: 0 }
        },
        y: {
          beginAtZero: true,
          ticks: {
            callback: function(value) { return (value / 1000).toFixed(0) + 'k'; }
          }
        }
      }
    },
    plugins: [ChartDataLabels]
  });
}

function drawAprilCharts(periods) {
  if (!periods || !periods.length) return;
  // Уничтожаем старые графики
  ['wonChartApril','cntChartApril','avgChartApril','dailyChartApril','dirChartApril','fmtChartApril'].forEach(id => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
  });

  const labels = periods.map(p => p.label);
  const paidSum = periods.map(p => p.paidSum || 0);
  const paidCnt = periods.map(p => p.paidCnt || 0);
  const lostCnt = periods.map(p => p.lostCnt || 0);
  const avgData = periods.map(p => p.paidCnt ? (p.paidSum || 0) / p.paidCnt : 0);
  const common = { responsive: true, maintainAspectRatio: false };

  chartInstances.wonChartApril = new Chart(document.getElementById('wonChartApril'), {
    type: 'bar', data: { labels, datasets: [{ label: 'Поступления, ₽', data: paidSum, backgroundColor: '#1565C0', borderRadius: 4 }] },
    options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
  chartInstances.cntChartApril = new Chart(document.getElementById('cntChartApril'), {
    type: 'bar', data: { labels, datasets: [
      { label: 'Оплачено', data: paidCnt, backgroundColor: '#2E7D32', borderRadius: 4 },
      { label: 'Проиграно', data: lostCnt, backgroundColor: '#C62828', borderRadius: 4 }
    ]},
    options: { ...common, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
  });
  chartInstances.avgChartApril = new Chart(document.getElementById('avgChartApril'), {
    type: 'line', data: { labels, datasets: [{ label: 'Средний чек, ₽', data: avgData, borderColor: '#E67E22', backgroundColor: 'rgba(200,164,92,0.1)', fill: true, tension: 0.3, pointRadius: 3 }] },
    options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  // HTML-воронка (песочные часы)
  const funnelDiv = document.getElementById('funnelContainer');
  if (funnelDiv && aprilData) {
    const totalLeads = aprilData.totalCreatedCnt || 0;
    const saleCreated = aprilData.createdSale || 0;
    const presaleF = aprilData.lostPreSale || 0;
    const saleP = aprilData.inWorkSale || 0;
    const paid = aprilData.paidFromCreated || 0;
    // Sale F (проиграно) = totalLost - PreSaleF
    const saleF = (aprilData.totalLostCnt || 0) - presaleF;
    // Sale S без оплаты = Sale - P - F - paid (paid уже внутри S)
    const saleWonNotPaid = Math.max(0, saleCreated - saleP - saleF - paid);
    
    const steps = [
      // Верхняя половина (сужение)
      { label: '① Все лиды (создано)', val: totalLeads, color: '#42A5F5' },
      { label: '② В Sale + на квалификации', val: aprilData.saleAndPreSaleInWork || 0, color: '#1E88E5' },
      { label: '③ Воронка Sale', val: saleCreated, color: '#1565C0' },
      // Нижняя половина (расширение — только Sale)
      { label: '✅ Оплачено', val: paid, color: '#22c55e' },
      { label: '🔄 В работе', val: saleP, color: '#FDD835' },
      { label: '🏆 Выиграно (ожидает оплаты)', val: saleWonNotPaid, color: '#7B1FA2' },
      { label: '❌ Проиграно (Sale)', val: saleF, color: '#ef5350' },
      // Отсев до воронки
      { label: '📄 Не прошли квалификацию (PreSale)', val: presaleF, color: '#819ca9' }
    ];
    const maxVal = steps[0].val || 1;
    let html = '';
    for (const s of steps) {
      const pct = (s.val / maxVal) * 100;
      const left = (100 - pct) / 2;
      html += '<div style="display:flex;align-items:center;margin:4px 0;gap:10px">' +
        '<div style="width:140px;text-align:right;font-size:12px;color:#555;flex-shrink:0">' + s.label + '</div>' +
        '<div style="flex:1;height:28px;position:relative">' +
          '<div style="position:absolute;left:' + left + '%;width:' + pct + '%;height:100%;background:' + s.color + ';border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:40px">' +
            '<span style="color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.3)">' + s.val.toLocaleString() + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    funnelDiv.innerHTML = html;
  }
}

        scales: { y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString() } } }
      }
    });
  }
}

// --- Переключение на вкладку «Апрель» ---
let currentTab = 'main'; // 'main' or 'april'

document.getElementById('aprilTabBtn').addEventListener('click', async function() {
  if (currentTab === 'april') return;
  currentTab = 'april';
  this.classList.toggle('active', true);
  document.querySelectorAll('#periodGroup button').forEach(b => b.classList.remove('active'));

  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>Расчёт по новым правилам…</div></div>';

  try {
    let data = await api('/api/month-report?year=2026&month=5');
    // Если кеш не готов, пробуем live API
    if (data.error || data.ready === false) {
      area.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>Загрузка данных (live)…</div></div>';
      data = await fetch(window.location.origin + '/rshu-dashboard/api/live-month-report?year=2026&month=5').then(r => r.json());
    }
    if (data.error) {
      area.innerHTML = '<div class="error-state">❌ ' + data.error + '</div>';
      return;
    }
    aprilData = data;
    document.getElementById('sourceInfo').textContent =
      '📋 Май 2026 · итоги · переходящий остаток: ' + (data.carryOver?.cnt || 0) + ' шт. / ' + ((data.carryOver?.sum || 0).toLocaleString()) + ' ₽';

  } catch (e) {
    area.innerHTML = '<div class="error-state">❌ Ошибка: ' + e.message + '</div>';
  }
});

function renderForecastPage(data) {

      <div class="kpi" style="border-top-color:#E65100"><div class="label">🔮 Прогноз (воронка)</div><div class="val">${(data.pipeline.may||0).toLocaleString()} ₽</div><div class="sub">счёт + постоплата</div></div>
      <div class="kpi" style="border-top-color:#FF8F00"><div class="label">📊 Прогноз (SQL)</div><div class="val">${(data.sql?.forecast||0).toLocaleString()} ₽</div><div class="sub">конверсия ${data.sql?.convPct||0}%</div></div>
      <div class="kpi" style="border-top-color:#1565C0"><div class="label">🆕 Прогноз (новые)</div><div class="val">${(data.newLeads.sum||0).toLocaleString()} ₽</div><div class="sub">${data.newLeads.cnt} новых лидов</div></div>
      <div class="kpi" style="border-top-color:#6A1B9A"><div class="label">📊 ИТОГО</div><div class="val">${(data.total||0).toLocaleString()} ₽</div><div class="sub">прогноз на май</div></div>
      <div class="kpi"><div class="label">📅 До конца месяца</div><div class="val">${data.daysLeft} дн.</div><div class="sub">${data.daysPassed} прошло</div></div>
      <div class="kpi"><div class="label">📋 Новых в день</div><div class="val">${data.newLeads.avgPerDay}</div><div class="sub">среднее за май</div></div>
    </div>

    <div class="card"><h3>🔮 Weighted pipeline — прогноз из текущей воронки</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:12px;font-weight:600;color:#2E7D32;margin-bottom:6px">✅ В МАЙ: ${(data.pipeline.may||0).toLocaleString()} ₽</div>
          <div class="scroll-x"><table style="font-size:12px">
            <thead><tr><th>Стадия</th><th class="num">Сумма</th><th class="num">Прогноз</th></tr></thead>
            <tbody id="pipelineMayBody"></tbody>
          </table></div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:#E65100;margin-bottom:6px">🔜 В ИЮНЬ: ${(data.pipeline.june||0).toLocaleString()} ₽</div>
          <div class="scroll-x"><table style="font-size:12px">
            <thead><tr><th>Стадия</th><th class="num">Сумма</th><th class="num">Прогноз</th></tr></thead>
            <tbody id="pipelineJuneBody"></tbody>
          </table></div>
        </div>
      </div>
    </div>

    <div class="card"><h3>👤 Менеджеры — прогресс</h3>
      <div class="scroll-x"><table>
        <thead><tr><th>Менеджер</th><th class="num">В работе</th><th class="num">Сумма в работе</th><th class="num">Со счетами</th><th class="num">Сумма счетов</th><th class="num">Оплачено</th><th class="num">Сумма оплат</th></tr></thead>
        <tbody id="forecastMgrsBody"></tbody>
      </table></div>
    </div>

    <div style="margin-top:12px;font-size:12px;color:#6a7a9a;text-align:center">
      🧹 <strong>Прогноз на июнь:</strong> факт мая ${(data.fact.sum||0).toLocaleString()} ₽ + воронка ${(data.pipeline.may||0).toLocaleString()} ₽ = <strong>${(data.total||0).toLocaleString()} ₽</strong>
      · <strong>Прогноз на июнь</strong> (из текущей воронки): ${(data.juneForecast||0).toLocaleString()} ₽
    </div>
  `;

  // Pipeline tables
  function renderPipelineStages(bodyId, stages, names) {
    const body = document.getElementById(bodyId);
    if (body && stages && stages.length) {
      body.innerHTML = stages.map(s => {
        const tag = s.stageId === 'DETAILS' ? 'orange' : s.stageId === 'PROPOSAL' ? 'red' : 'green';
        return '<tr><td><span class="tag ' + tag + '">' + (names[s.stageId]||s.stageId) + '</span></td>'
          + '<td class="num">' + (s.sum||0).toLocaleString() + ' ₽</td>'
          + '<td class="num"><strong>' + Math.round(s.forecast).toLocaleString() + ' ₽</strong></td></tr>';
      }).join('');
    }
  }
  const stageNames = {'DETAILS':'SQL','PROPOSAL':'Счёт','2':'Постоплата','6':'Частичная','UC_4RJOR4':'MQL','UC_STZB49':'Взят','UC_838R2R':'Консульт.'};
  if (data.pipeline.stagesMay) renderPipelineStages('pipelineMayBody', data.pipeline.stagesMay, stageNames);
  if (data.pipeline.stagesJune) renderPipelineStages('pipelineJuneBody', data.pipeline.stagesJune, stageNames);

  // Managers table
  const mBody = document.getElementById('forecastMgrsBody');
  if (mBody && mgrs.length) {
    mBody.innerHTML = mgrs.slice(0, 30).map(m => {
      return '<tr>'
        + '<td>' + m.name + '</td>'
        + '<td class="num">' + (m.inWork||0) + '</td>'
        + '<td class="num">' + ((m.inWorkSum||0)).toLocaleString() + ' ₽</td>'
        + '<td class="num"><strong>' + (m.withMoney||0) + '</strong></td>'
        + '<td class="num"><strong>' + ((m.withMoneySum||0)).toLocaleString() + ' ₽</strong></td>'
        + '<td class="num">' + (m.paid||0) + '</td>'
        + '<td class="num">' + ((m.paidSum||0)).toLocaleString() + ' ₽</td></tr>';
    }).join('');
  } else if (mBody) {
    mBody.innerHTML = '<tr><td colspan="7" class="loading-state">Нет данных</td></tr>';
  }
}

// Возврат к основному дашборду при переключении периода
const origPeriodListener = document.getElementById('periodGroup').click;
document.getElementById('periodGroup').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.period) return;
  const period = btn.dataset.period;
  
  // Сбрасываем вкладки
  currentTab = 'main';
  document.getElementById('aprilTabBtn').classList.remove('active');
  document.getElementById('forecastTabBtn').classList.remove('active');
  
  if (period === currentPeriod) return;
  this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = period;
  loadAll(period);
});

function renderProductsPage(data) {
  const area = document.getElementById('contentArea');
  
  function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }
  function fRow(items, showFmt) {
    return items.map((item, i) => {
      const fmts = showFmt ? Object.entries(item.formats||{}).sort((a,b) => b[1]-a[1]).map(([f,c]) => f+':'+c).join(', ') : '';
      return '<tr><td>'+(i+1)+'</td><td>'+item.name+'</td><td>'+item.cnt+'</td><td>'+fmt(item.rev)+' ₽</td><td>'+(item.cnt>0?fmt(Math.round(item.rev/item.cnt)):'0')+' ₽</td>'+(showFmt?'<td>'+fmts+'</td>':'')+'</tr>';
    }).join('');
  }
  
  area.innerHTML = 
    '<div class="grid-4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">' +
      '<div class="card"><h3>💰 Всего оплат</h3><div style="font-size:24px;font-weight:700;color:#1565C0">'+fmt(data.total_all)+'</div></div>' +
      '<div class="card"><h3>⭐ Основной</h3><div style="font-size:24px;font-weight:700;color:#2E7D32">'+data.main.count+'</div><div style="font-size:13px;color:#666">'+fmt(data.main.revenue)+' ₽</div></div>' +
      '<div class="card"><h3>📌 ILP</h3><div style="font-size:24px;font-weight:700;color:#7B1FA2">'+data.ilp.count+'</div><div style="font-size:13px;color:#666">'+fmt(data.ilp.revenue)+' ₽</div></div>' +
      '<div class="card"><h3>📌 Корп.обучение</h3><div style="font-size:24px;font-weight:700;color:#E65100">'+data.corp.count+'</div><div style="font-size:13px;color:#666">'+fmt(data.corp.revenue)+' ₽</div></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:16px"><h3>🏆 ТОП-20 по сумме</h3><div class="scroll-x"><table><thead><tr><th>#</th><th>Продукт</th><th>Кол</th><th>Выручка</th><th>Ср.чек</th><th>Форматы</th></tr></thead><tbody>' +
    fRow(data.main.byRev, true) +
    '<tr style="font-weight:700;border-top:2px solid #333"><td></td><td>ИТОГО</td><td>'+data.main.count+'</td><td>'+fmt(data.main.revenue)+' ₽</td><td>'+fmt(Math.round(data.main.revenue/data.main.count))+' ₽</td><td></td></tr>' +
    '</tbody></table></div></div>' +
    '<div class="card" style="margin-bottom:16px"><h3>🏆 ТОП-20 по количеству</h3><div class="scroll-x"><table><thead><tr><th>#</th><th>Продукт</th><th>Кол</th><th>Выручка</th><th>Ср.чек</th><th>Форматы</th></tr></thead><tbody>' +
    fRow(data.main.byCnt, true) +
    '<tr style="font-weight:700;border-top:2px solid #333"><td></td><td>ИТОГО</td><td>'+data.main.count+'</td><td>'+fmt(data.main.revenue)+' ₽</td><td>'+fmt(Math.round(data.main.revenue/data.main.count))+' ₽</td><td></td></tr>' +
    '</tbody></table></div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
      '<div class="card"><h3>📌 ILP</h3><div class="scroll-x"><table><thead><tr><th>#</th><th>Продукт</th><th>Кол</th><th>Выручка</th></tr></thead><tbody>'+

      '<div class="card"><h3>📌 Корп. обучение</h3><div class="scroll-x"><table><thead><tr><th>#</th><th>Продукт</th><th>Кол</th><th>Выручка</th></tr></thead><tbody>'+
      (data.corp.items.length ? data.corp.items.map((item,i) => '<tr><td>'+(i+1)+'</td><td>'+item.name+'</td><td>'+item.cnt+'</td><td>'+fmt(item.rev)+' ₽</td></tr>').join('') : '<tr><td colspan="4">—</td></tr>')+
