<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Отчёт отдела продаж</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F7F8FA; margin: 0; padding: 16px 20px; color: #1a1a1a; }
    .page-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .page-header h1 { font-size:22px; margin:0; color:#093EB4; }
    .page-header .meta { font-size:12px; color:#888; }
    .tabs { display:flex; gap:4px; margin-bottom:16px; }
    .tab { padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; font-weight:600; background:#e0e0e0; color:#555; border:none; }
    .tab.active { background:#093EB4; color:#fff; }
    .tab:hover:not(.active) { background:#ccc; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:14px; margin-bottom:12px; }
    .card h2 { font-size:15px; font-weight:600; margin:0 0 10px; color:#1f2a44; }
    table { width:100%; border-collapse:collapse; font-size:11px; }
    th { background:#093EB4; color:#fff; padding:6px 6px; text-align:center; font-weight:600; font-size:10px; }
    td { padding:5px 6px; text-align:center; border-bottom:1px solid #e0e0e0; }
    tr:hover td { background:#f0f4ff; }
    .text-left { text-align:left; }
    .fw-bold { font-weight:700; }
    .badge { display:inline-block; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:600; color:#fff; }
    .badge-blue { background:#093EB4; }
    .badge-teal { background:#00bcd4; }
    .badge-amber { background:#F57C00; }
    .badge-green { background:#43A047; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-bottom:10px; }
    .kpi { background:#fff; border-radius:10px; padding:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .kpi .lbl { font-size:11px; color:#666; margin-bottom:2px; }
    .kpi .val { font-size:18px; font-weight:700; color:#1f2a44; }
    .kpi .sub { font-size:10px; color:#888; margin-top:2px; }
    .scroll-x { overflow-x:auto; }
    .summary-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:8px 0; }
    .summary-card { background:#f7f8fa; border-radius:8px; padding:10px; }
    .summary-card .lbl { font-size:10px; color:#666; }
    .summary-card .val { font-size:16px; font-weight:700; color:#1f2a44; }
    .summary-card .sub { font-size:9.5px; color:#888; margin-top:2px; }
    .next-step { font-size:10px; color:#888; font-style:italic; margin-top:6px; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>📊 Отчёт отдела продаж</h1>
  <span class="meta" id="updateDate"></span>
</div>

<div class="tabs">
  <button class="tab active" data-tab="overview">📊 Общая динамика</button>
  <button class="tab" data-tab="managers">👥 Менеджеры</button>
  <button class="tab" data-tab="products">📈 Продукты</button>
</div>

<div id="tab-overview" class="tab-content active">
  <div id="overviewContent"></div>
</div>
<div id="tab-managers" class="tab-content">
  <div id="managersContent"></div>
</div>
<div id="tab-products" class="tab-content">
  <div id="productsContent"></div>
</div>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
function escapeHtml(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}
function fmt(n){return (n===undefined||n===null)?"0":Number(n).toLocaleString("ru-RU",{maximumFractionDigits:0});}
function pct(v){return (v||0).toFixed(1)+"%";}

var BP = window.location.pathname.replace(/\/$/,"");
async function api(p){var r=await fetch(BP+p);if(r.redirected||r.url.endsWith("/login")){window.location.href="/login";throw Error("redirect");}return r.json();}

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(function(tab){
  tab.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
    document.querySelectorAll(".tab-content").forEach(function(tc){tc.classList.remove("active");});
    tab.classList.add("active");
    document.getElementById("tab-"+tab.dataset.tab).classList.add("active");
  });
});

// ── Load All ───────────────────────────────────────────────────────────────────
async function loadAll(){
  var [data, managers, carryover, plans] = await Promise.all([
    api("/api/data"), api("/api/managers"), api("/api/carryover"), api("/api/plans")
  ]);
  if(data._loadedAt) document.getElementById("updateDate").textContent = "(данные: "+data._loadedAt.substring(0,10)+")";

  renderOverview(data, carryover);
  renderManagers(data, managers, plans);
  renderProducts(data);
}

// ════════════════════════ ВКЛАДКА 1: ОБЩАЯ ДИНАМИКА ════════════════════════
function renderOverview(data, carryover){
  var ytd = data.ytd || {};
  var html = "";

  // KPI
  html += '<div class="kpis">' +
    '<div class="kpi"><div class="lbl">📊 Поступления YTD</div><div class="val">'+fmt(ytd.postupleniya)+' ₽</div><div class="sub">'+fmt(ytd.won_relevant_cnt)+' сделок</div></div>' +
    '<div class="kpi"><div class="lbl">📈 Конверсия YTD</div><div class="val">'+pct(ytd.conv_deal_pct)+'</div><div class="sub">WON/(WON+LOSE)</div></div>' +
    '<div class="kpi"><div class="lbl">💰 Средний чек</div><div class="val">'+fmt(ytd.avg_check)+' ₽</div><div class="sub">медиана '+fmt(ytd.median_check)+' ₽</div></div>' +
    '<div class="kpi"><div class="lbl">⏱ Цикл сделки</div><div class="val">'+pct(ytd.avg_close_days_won)+' дн</div></div>' +
    '<div class="kpi"><div class="lbl">🏗 В работе</div><div class="val">'+fmt(carryover.inWork||0)+'</div><div class="sub">'+fmt(Math.round((carryover.inWorkSum||0)))+' ₽</div></div>' +
    '</div>';

  // Конвейер
  var paidPct = carryover.created > 0 ? ((carryover.paid || 0) / carryover.created * 100).toFixed(1) : 0;
  var remain = (carryover.inWork||0) + (carryover.created||0) - (carryover.paid||0) - (carryover.lost||0);
  html += '<div class="card"><h2>🏭 Конвейер (YTD)</h2>' +
    '<div class="summary-cards">' +
    '<div class="summary-card"><div class="lbl">Переходящий остаток</div><div class="val">'+fmt(carryover.inWork||0)+' сд.</div><div class="sub">'+fmt(Math.round(carryover.inWorkSum||0))+' ₽</div></div>' +
    '<div class="summary-card"><div class="lbl">Создано в периоде</div><div class="val">'+fmt(carryover.created||0)+' сд.</div><div class="sub">'+fmt(Math.round(carryover.createdSum||0))+' ₽</div></div>' +
    '<div class="summary-card"><div class="lbl">✅ Оплачено</div><div class="val">'+fmt(carryover.paid||0)+' сд.</div><div class="sub">'+fmt(Math.round(carryover.paidSum||0))+' ₽ · '+paidPct+'%</div></div>' +
    '<div class="summary-card"><div class="lbl">❌ Проиграно</div><div class="val">'+fmt(carryover.lost||0)+' сд.</div><div class="sub">'+fmt(Math.round(carryover.lostSum||0))+' ₽</div></div>' +
    '</div></div>';

  // Недельная таблица
  var weeks = data.weeks || [];
  html += '<div class="card"><h2>📋 Детализация по неделям</h2><div class="scroll-x"><table><thead><tr>' +
    '<th>Неделя</th><th>Лиды</th><th>MQL</th><th>SQL</th><th>Счёт</th><th>Сделки</th><th>Поступл.</th><th>Ср.чек</th><th>Цикл</th><th>Лиды→MQL</th><th>MQL→SQL</th><th>SQL→Счёт</th><th>Счёт→Сд.</th><th>Лид→Сд.</th></tr></thead><tbody>';
  weeks.slice().reverse().forEach(function(w){
    if (!w) return;
    var cl = w.leads>0?(w.mql/w.leads*100).toFixed(1):0;
    var cs = w.mql>0?(w.sql/w.mql*100).toFixed(1):0;
    var si = w.sql>0?((w.invoice_cnt||0)/w.sql*100).toFixed(1):0;
    var io = (w.invoice_cnt||0)>0?(w.oplata/w.invoice_cnt*100).toFixed(1):0;
    var lo = w.leads>0?(w.oplata/w.leads*100).toFixed(1):0;
    html += '<tr><td><b>Неделя '+String(w.week).padStart(2,'0')+'</b></td><td>'+(w.leads||0)+'</td><td>'+(w.mql||0)+'</td><td>'+(w.sql||0)+'</td><td>'+(w.invoice_cnt||0)+'</td><td>'+(w.oplata||0)+'</td><td><b>'+fmt(w.postupleniya)+'</b></td><td>'+fmt(w.avg_check||0)+'</td><td>'+(w.avg_dur||0).toFixed(1)+'</td><td>'+cl+'%</td><td>'+cs+'%</td><td>'+si+'%</td><td>'+io+'%</td><td>'+lo+'%</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // ⏩ Следующий шаг
  html += '<div class="card" style="background:#fff8e1"><h2>📅 Следующий шаг</h2>' +
    '<ul style="font-size:11px;margin:0 0 0 16px">' +
    '<li><b>Дневная детализация</b> — таблица/график по дням внутри месяца</li>' +
    '<li><b>Прогресс месяца</b> — % времени vs % плана</li>' +
    '<li><b>Даты периода</b> — селектор "с" и "по" + сравнение</li>' +
    '</ul></div>';

  document.getElementById("overviewContent").innerHTML = html;
}

// ════════════════════════ ВКЛАДКА 2: МЕНЕДЖЕРЫ ════════════════════════════
function renderManagers(data, mgrs, plans){
  var html = '';

  // Таблица менеджеров
  html += '<div class="card"><h2>👥 Сводка по менеджерам</h2><div class="scroll-x"><table><thead><tr>' +
    '<th>#</th><th>Менеджер</th><th>Лиды</th><th>MQL/SQL/Счёт</th><th>Сделки</th><th>Поступления</th><th>Ср.чек</th><th>Цикл,дн</th><th>Конв.</th><th>В работе</th><th>ООМ/КОМ</th><th>📊 План</th></tr></thead><tbody>';
  mgrs.forEach(function(m, i){
    if (!m.name) return;
    var oomStr = m.oom_deals+' / '+fmt(m.oom_sum);
    var komStr = m.kom_deals+' / '+fmt(m.kom_sum);
    html += '<tr><td>'+(i+1)+'</td><td class="text-left fw-bold">'+escapeHtml(m.name)+'</td>' +
      '<td>'+m.leads+'</td>' +
      '<td>'+m.deals+' / '+m.deals+' / '+m.deals+'</td>' +
      '<td><b>'+m.deals+'</b></td>' +
      '<td><b>'+fmt(m.postupleniya)+'</b></td>' +
      '<td>'+fmt(m.avg_check)+'</td>' +
      '<td>'+(m.avg_dur||0).toFixed(1)+'</td>' +
      '<td>'+pct(m.conv)+'</td>' +
      '<td>'+m.in_work+'</td>' +
      '<td><span class="badge badge-green">'+oomStr+'</span> <span class="badge badge-amber">'+komStr+'</span></td>' +
      '<td><span class="badge badge-blue">⏩</span></td></tr>';
  });
  html += '</tbody></table></div></div>';

  // ⏩ Следующий шаг — карточка менеджера
  html += '<div class="card" style="background:#fff8e1"><h2>📅 Следующий шаг</h2>' +
    '<ul style="font-size:11px;margin:0 0 0 16px">' +
    '<li><b>Карточка менеджера</b> — клик по строке → его сделки, стадии, «зависшие»</li>' +
    '<li><b>План × Факт</b> — план на месяц vs факт (данные планов есть в test-dashboard)</li>' +
    '<li><b>Активности менеджера</b> — звонки, контакты (из B24 ACTIVITY или Roistat)</li>' +
    '<li><b>B2B/B2C / Форматы</b> — разбивка по каждому менеджеру</li>' +
    '</ul></div>';

  // Карточка: выбор менеджера + его сделки
  html += '<div class="card"><h2>🔍 Прототип карточки менеджера</h2>' +
    '<div style="margin-bottom:8px"><select id="mgrSelect" style="padding:6px;border-radius:6px;border:1px solid #ccc;font-size:12px">' +
    '<option value="">— выберите менеджера —</option>';
  mgrs.forEach(function(m){ if(m.name) html += '<option value="'+escapeHtml(m.name)+'">'+escapeHtml(m.name)+'</option>'; });
  html += '</select></div><div id="mgrDeals" style="font-size:11px;color:#888">Выберите менеджера для просмотра сделок</div></div>';

  document.getElementById("managersContent").innerHTML = html;

  // Подгрузка сделок при выборе менеджера
  document.getElementById("mgrSelect").addEventListener("change", function(){
    var name = this.value;
    if (!name) { document.getElementById("mgrDeals").innerHTML = "Выберите менеджера"; return; }
    document.getElementById("mgrDeals").innerHTML = "Загрузка...";
    api("/api/manager-deals?name="+encodeURIComponent(name)).then(function(deals){
      var h = '<div class="scroll-x"><table><thead><tr><th>ID</th><th>Сделка</th><th>Сумма</th><th>Стадия</th><th>Создан</th><th>Формат</th><th>Тип</th><th>Статус</th></tr></thead><tbody>';
      deals.slice(0,30).forEach(function(d){
        var status = d.is_paid ? '<span class="badge badge-green">Оплачено</span>' : (d.in_work ? '<span class="badge badge-amber">В работе</span>' : '<span class="badge badge-blue">Закрыто</span>');
        h += '<tr><td>'+d.id+'</td><td class="text-left">'+escapeHtml((d.title||'').substring(0,60))+'</td><td>'+fmt(d.opp)+'</td><td>'+escapeHtml(d.stage)+'</td><td>'+(d.dc||'')+'</td><td>'+escapeHtml(d.format||'')+'</td><td>'+(d.btype||'')+'</td><td>'+status+'</td></tr>';
      });
      h += '</tbody></table></div>';
      if (deals.length > 30) h += '<div class="next-step">Показано 30 из '+deals.length+' сделок (след. шаг: пагинация + фильтры)</div>';
      document.getElementById("mgrDeals").innerHTML = h;
    }).catch(function(e){
      document.getElementById("mgrDeals").innerHTML = "Ошибка: "+e.message;
    });
  });
}

// ════════════════════════ ВКЛАДКА 3: ПРОДУКТЫ ════════════════════════════
function renderProducts(data){
  var html = '<div class="card" style="background:#fff8e1">' +
    '<h2>📦 Продукты / Форматы / Источники</h2>' +
    '<p style="font-size:11px;color:#888">Перенесено из ratings-dashboard. Полная реализация — следующий шаг.</p>' +
    '<div class="next-step">Данные доступны в getAgg().top_products, .top_companies, .src_funnel. Перенести таблицы как есть.</div>' +
    '</div>';
  document.getElementById("productsContent").innerHTML = html;
}

// ── Запуск ────────────────────────────────────────────────────────────────────
loadAll().catch(function(e){
  document.getElementById("overviewContent").innerHTML = '<div style="padding:20px;color:red">❌ Ошибка: '+escapeHtml(e.message)+'</div>';
});
</script>
</body>
</html>
