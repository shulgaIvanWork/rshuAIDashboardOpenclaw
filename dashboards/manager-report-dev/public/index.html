<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-РОП: Отчёт по менеджерам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #F1F3F6; color: #1f2a44; font-size: 13px; }
.container { max-width: 1500px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin-bottom: 2px; }
.sub { color: #888; font-size: 12px; margin-bottom: 12px; }
.card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card h2 { font-size: 14px; margin-bottom: 10px; color: #1f2a44; }
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
th { background: #f8f9fc; padding: 7px 8px; text-align: center; font-weight: 600; font-size: 10px; color: #475569; border-bottom: 2px solid #e2e8f0; cursor: pointer; user-select: none; }
th.srt { cursor: pointer; }
th.srt:hover { background: #eef1f8; }
th.asc::after { content: ' ▲'; } th.desc::after { content: ' ▼'; }
td { padding: 5px 8px; border-bottom: 1px solid #f1f3f6; text-align: center; }
td:first-child { text-align: left; font-weight: 600; }
tr:hover td { background: #f8f9ff; }
tr.total td { background: #eef1f8; font-weight: 700; border-top: 2px solid #1f2a44; }
.green { color: #2e7d32; } .red { color: #c62828; } .yellow { color: #e65100; }
.badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.badge-green { background: #e8f5e9; color: #2e7d32; }
.badge-red { background: #ffebee; color: #c62828; }
.badge-yellow { background: #fff8e1; color: #e65100; }
.summary-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 14px; }
.summary-card { background: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.summary-card .lbl { font-size: 10px; color: #888; margin-bottom: 2px; }
.summary-card .val { font-size: 18px; font-weight: 700; }
.sec-label { font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 8px; padding-left: 4px; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
var _p = window.location.pathname;
var _m = _p.match(/^\/([^/]+?)(?:\/|$)/);
var BP = _m ? '/' + _m[1] : '';

var refreshStepsData = [
  { key: 'fetch_data',   label: 'Загрузка данных',         weight: 50 },
  { key: 'analyze',      label: 'Анализ данных',           weight: 50 },
];

var statusPanelHTML = '' +
  '<div id="refreshStatusPanel" class="refresh-panel" style="display:none">' +
    '<div class="refresh-header">' +
      '<span class="refresh-title">\ud83d\udd04 Обновление данных</span>' +
      '<span class="refresh-elapsed" id="statusElapsed">\u23f1 0\u043c 0\u0441</span>' +
    '</div>' +
    '<div class="progress-bar refresh-progress-bar">' +
      '<div class="progress-fill" id="statusProgressFill" style="width:0%"></div>' +
    '</div>' +
    '<div id="statusSteps" class="refresh-steps"></div>' +
    '<div id="statusDealProgress" class="refresh-deal-progress"></div>' +
  '</div>';

function renderStepLines(curIdx, steps, progressPct) {
  var h = '';
  for (var i = 0; i < steps.length; i++) {
    var s = steps[i];
    var icon, cls, label;
    if (i < curIdx) { icon = '\u2705'; cls = 'step-done'; label = s.label; }
    else if (i === curIdx) { icon = '\u23f3'; cls = 'step-active'; label = s.label + ' <span class="step-weight">(' + s.weight + '%)</span>'; }
    else { icon = '\u2b1c'; cls = 'step-pending'; label = s.label + ' <span class="step-weight">(' + s.weight + '%)</span>'; }
    h += '<div class="refresh-step ' + cls + '">' +
      '<span class="step-icon">' + icon + '</span>' +
      '<span class="step-label">' + label + '</span>' +
    '</div>';
  }
  return h;
}

async function safeFetch(url, opts) {
  var resp = await fetch(url, opts);
  if (resp.redirected || resp.url.endsWith('/login')) { window.location.href = '/login'; throw new Error('redirect'); }
  var text = await resp.text();
  if (text.startsWith('<!DOCTYPE')) { window.location.href = '/login'; throw new Error('redirect'); }
  return JSON.parse(text);
}

function n(v) { return (v===undefined||v===null||v===0)?'0':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:0}); }
function p(v) { return (v||0).toFixed(1)+'%'; }
function e(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bdg(v, lo, hi) { return v>=hi?'green':v<=lo?'red':'yellow'; }

function changePeriod() {
  load();
}

var periodLabel = 'Весь 2026 год (YTD)';

function load() {
  var sel = document.getElementById('periodSelect');
  var val = sel ? sel.value : 'ytd';
  var url = BP+'/api/managers';
  if (val !== 'ytd') {
    var from = val + '-01';
    var to = val + '-30';
    if (['01','03','05'].indexOf(val.slice(-2)) >= 0) to = val + '-31';
    if (val.slice(-2) === '02') to = val + '-28';
    url += '?from='+from+'&to='+to;
    var months = ['','Январь','Февраль','Март','Апрель','Май','Июнь'];
    periodLabel = months[parseInt(val.slice(-2))] + ' 2026';
  } else {
    periodLabel = 'Весь 2026 год (YTD)';
  }
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var m = d.managers || [];
    app(m, periodLabel);
  }).catch(function(err){
    document.getElementById('app').innerHTML = '<div class=card style="color:#c62828;padding:20px"><b>Ошибка загрузки:</b> '+e(err.message)+'</div>';
  });
}

function app(mgrs, periodLabel) {
  mgrs = mgrs.filter(function(m){return m.paid||m.created||m.in_work_start;});
  var tot = {
    paid: sum(mgrs,'paid'),
    kval_lost: sum(mgrs,'kval_lost'),
    nekval_lost: sum(mgrs,'nekval_lost'),
    created: sum(mgrs,'created'),
    post: sum(mgrs,'paid_sum'),
    dur: wavg(mgrs,'avg_dur','paid'),
    conv: sum(mgrs,'paid')/(sum(mgrs,'paid')+sum(mgrs,'kval_lost')+sum(mgrs,'nekval_lost'))*100,
    end: sum(mgrs,'in_work_end'),
  };

  var html = '<h1>🤖 ИИ-РОП: Отчёт по менеджерам</h1>';
  html += '<p class=sub>менеджеров: '+mgrs.length+' · данные ratings-dashboard · <b id=periodLabel>'+periodLabel+'</b></p>';

  // Period selector
  html += '<div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">';
  html += '<select id=periodSelect style="padding:6px 10px;border-radius:6px;border:1px solid #ddd;font-size:13px" onchange="changePeriod()">';
  html += '<option value="ytd">Весь 2026 год (YTD)</option>';
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь'];
  months.forEach(function(m,i){ var mo=String(i+1).padStart(2,'0'); html+='<option value="2026-'+mo+'">'+m+' 2026</option>'; });
  html += '</select>';
  html += '</div>';

  // Summary
  var start = sum(mgrs,'in_work_start');
  html += '<div class="toolbar" style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center"><button id="refreshBtn" style="background:#093EB4;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500">\ud83d\udd04 Обновить данные</button></div>';
  html += '<div class=summary-grid>';
  html += card('📦 В работе (нач.)', n(start));
  html += card('➕ Создано', n(tot.created = sum(mgrs,'created')));
  html += card('💰 Поступления', n(tot.post)+' ₽');
  html += card('⏱ Средний цикл', tot.dur.toFixed(1)+' дн');
  html += card('📊 Конверсия', (tot.conv||0).toFixed(1)+'%');
  html += card('❌ Квал отказы', n(tot.kval_lost));
  html += card('❌ Не квал', n(tot.nekval_lost));
  html += '</div>';

  // Table 1
  html += '<div class=card>';
  html += '<div class=sec-label>📋 Таблица 1: Основные показатели</div>';
  html += '<div class=scroll-x>'+tab1(mgrs)+'</div>';
  html += '</div>';

  // Table 2
  html += '<div class=card>';
  html += '<div class=sec-label>📊 Таблица 2: Конверсии и отклонения от среднего</div>';
  html += '<div class=scroll-x>'+tab2(mgrs)+'</div>';
  html += '</div>';

  // Horizontal bars
  html += '<div class=card>';
  html += '<div class=sec-label>📊 Срезы по менеджерам (горизонтальный stacked bar)</div>';
  html += renderBars(mgrs);
  html += '</div>';

  // Менеджеры YTD
  html += '<div class=card><h2>Менеджеры YTD <span style="font-size:12px;color:#888;font-weight:400">(основная воронка · лиды из CRM)</span></h2><div class=scroll-x>';
  html += '<table style="font-size:11px;white-space:nowrap"><tr><th>Менеджер</th><th>Лидов CRM</th><th>WON</th><th>Квал отк</th><th>Не квал</th><th>Конв.%</th><th>Ср.чек, ₽</th><th>Поступления, ₽</th></tr>';
  mgrs.filter(function(m){return m.leads > 0;}).forEach(function(m, i){
    html += '<tr><td><b>'+e(m.name)+'</b></td><td>'+m.leads+'</td><td><b>'+m.paid+'</b></td><td>'+(m.kval_lost||0)+'</td><td>'+(m.nekval_lost||0)+'</td><td>'+(m.conv_pct||0).toFixed(1)+'%</td><td>'+n(m.avg_check)+' ₽</td><td><b>'+n(m.paid_sum)+'</b> ₽</td></tr>';
  });
  html += '</table></div></div>';

  // Воронка
  html += '<div class=card><h2>Воронка <span style="font-size:12px;color:#475569;font-weight:400">(фиксация состояния в периоде с учетом переходящего остатка, без учета даты создания)</span></h2><div style="height:600px;position:relative"><canvas id="funnelChart"></canvas></div></div>';

  document.getElementById('app').innerHTML = html;
  loadFunnel();
}

function sum(arr,k) { return arr.reduce(function(s,x){return s+(x[k]||0);},0); }
function wavg(arr,k,w) { var n=0,d=0; arr.forEach(function(x){n+=(x[k]||0)*(x[w]||0);d+=x[w]||0;}); return d?n/d:0; }
function card(l,v) { return '<div class=summary-card><div class=lbl>'+l+'</div><div class=val>'+v+'</div></div>'; }

function tab1(mgrs) {
  var cols = [
    {k:'name',l:'Менеджер'},
    {k:'in_work_start',l:'📦 В работе(н)'},
    {k:'created',l:'➕ Создано'},
    {k:'na_kvalifikatsii',l:'🔍 На квал-и'},
    {k:'mql',l:'🎯 MQL'},
    {k:'sql',l:'📊 SQL'},
    {k:'invoice_cnt',l:'📄 Счёт'},
    {k:'paid',l:'✅ Оплачено'},
    {k:'kval_lost',l:'❌ Квал отказы'},
    {k:'nekval_lost',l:'❌ Не квал'},
    {k:'in_work_end',l:'🔄 В работе(к)'},
    {k:'paid_sum',l:'💰 Пост-я'},
    {k:'avg_check',l:'💵 Ср.чек'},
    {k:'avg_dur',l:'⏱ Цикл'},
    {k:'conv_pct',l:'📊 Конв.%'},
  ];

  var h = '<table><thead><tr>';
  cols.forEach(function(c){ h += '<th>'+c.l+'</th>'; });
  h += '</tr></thead><tbody>';

  mgrs.forEach(function(m){
    h += '<tr>';
    cols.forEach(function(c){
      if (c.k === 'name') { h += '<td><b>'+e(m.name)+'</b></td>'; return; }
      var v = m[c.k]||0;
      if (c.k === 'paid_sum') h += '<td><b>'+n(v)+'</b> ₽</td>';
      else if (c.k === 'avg_check') h += '<td>'+n(v)+' ₽</td>';
      else if (c.k === 'avg_dur') h += '<td>'+(v?v.toFixed(1):'-')+'</td>';
      else if (c.k === 'conv_pct') h += '<td><span class="badge badge-'+bdg(v,30,60)+'">'+p(v)+'</span></td>';
      else h += '<td>'+n(v)+'</td>';
    });
    h += '</tr>';
  });

  // Итого
  var T = {};
  cols.forEach(function(c){
    if (c.k==='name') return;
    if (c.k==='paid_sum') T[c.k]=sum(mgrs,'paid_sum');
    else if (c.k==='avg_check') T[c.k]=Math.round(sum(mgrs,'paid_sum')/(sum(mgrs,'paid')||1));
    else if (c.k==='avg_dur') T[c.k]=wavg(mgrs,'avg_dur','paid');
    else if (c.k==='conv_pct') { var pd=sum(mgrs,'paid'),lo=sum(mgrs,'kval_lost')+sum(mgrs,'nekval_lost'); T[c.k]=pd/(pd+lo)*100; }
    else T[c.k]=sum(mgrs,c.k);
  });
  h += '<tr class=total><td><b>📊 ИТОГО</b></td>';
  cols.forEach(function(c){
    if (c.k==='name') return;
    var v = T[c.k];
    if (c.k==='paid_sum') h += '<td><b>'+n(v)+'</b> ₽</td>';
    else if (c.k==='avg_check') h += '<td>'+n(v)+' ₽</td>';
    else if (c.k==='avg_dur') h += '<td>'+(v?v.toFixed(1):'-')+'</td>';
    else if (c.k==='conv_pct') h += '<td><span class="badge badge-'+bdg(v,30,60)+'">'+p(v)+'</span></td>';
    else h += '<td><b>'+n(v)+'</b></td>';
  });
  h += '</tr></tbody></table>';
  return h;
}

function tab2(mgrs) {
  var allLost = sum(mgrs,'kval_lost')+sum(mgrs,'nekval_lost');
  var st = {
    cc: sum(mgrs,'created')?sum(mgrs,'mql')/sum(mgrs,'created')*100:0,
    cs: sum(mgrs,'mql')?sum(mgrs,'sql')/sum(mgrs,'mql')*100:0,
    ci: sum(mgrs,'sql')?sum(mgrs,'invoice_cnt')/sum(mgrs,'sql')*100:0,
    cp: sum(mgrs,'invoice_cnt')?sum(mgrs,'paid')/sum(mgrs,'invoice_cnt')*100:0,
    conv: (sum(mgrs,'paid')+allLost)?sum(mgrs,'paid')/(sum(mgrs,'paid')+allLost)*100:0,
    dur: wavg(mgrs,'avg_dur','paid'),
    chk: sum(mgrs,'paid')?sum(mgrs,'paid_sum')/sum(mgrs,'paid')||0:0,
    sum: sum(mgrs,'paid_sum'),
  };

  var cols = [
    {k:'name',l:'Менеджер'},
    {k:'conv_lead_mql',l:'📊 Создано→MQL',avg:st.cc,lo:30,hi:70},
    {k:'conv_mql_sql',l:'📊 MQL→SQL',avg:st.cs,lo:40,hi:80},
    {k:'conv_sql_inv',l:'📊 SQL→Счёт',avg:st.ci,lo:30,hi:70},
    {k:'conv_inv_paid',l:'📊 Счёт→Оплата',avg:st.cp,lo:50,hi:90},
    {k:'conv_pct',l:'📊 Конв.%',avg:st.conv,lo:30,hi:60},
    {k:'avg_dur',l:'⏱ Цикл',avg:st.dur,lo:45,hi:15,rev:true},
    {k:'avg_check',l:'💵 Ср.чек',avg:st.chk,lo:40000,hi:90000},
    {k:'paid_sum',l:'💰 Пост-я',avg:st.sum,lo:2000000,hi:8000000},
  ];

  function fmtCell(k,v,avg,lo,hi,rev) {
    if (k==='paid_sum') return '<b>'+n(v)+'</b> ₽';
    if (k==='avg_check') return n(v)+' ₽';
    if (k==='avg_dur') return v? v.toFixed(1) : '-';
    if (k.startsWith('conv')) return p(v);
    return n(v);
  }

  var h = '<table><thead><tr>';
  cols.forEach(function(c){ h += '<th style="font-size:9px">'+c.l+'</th>'; });
  h += '</tr></thead><tbody>';

  mgrs.forEach(function(m){
    h += '<tr>';
    cols.forEach(function(c){
      if (c.k==='name') { h += '<td><b>'+e(m.name)+'</b></td>'; return; }
      var v = m[c.k]||0;
      var avg = c.avg;
      var diff = avg ? (v-avg)/avg*100 : 0;
      var cls = 'yellow';
      if (Math.abs(diff) > 10) cls = c.rev ? (v<avg?'green':'red') : (v>avg?'green':'red');
      h += '<td class='+cls+'>'+fmtCell(c.k,v,avg,c.lo,c.hi,c.rev)+'</td>';
    });
    h += '</tr>';
  });

  h += '<tr class=total><td><b>📊 СРЕДНЕЕ</b></td>';
  cols.forEach(function(c){
    if (c.k==='name') return;
    h += '<td><b>'+fmtCell(c.k,st[c.k==='conv_lead_mql'?'cc':c.k==='conv_mql_sql'?'cs':c.k==='conv_sql_inv'?'ci':c.k==='conv_inv_paid'?'cp':c.k],st[c.k==='conv_lead_mql'?'cc':c.k==='conv_mql_sql'?'cs':c.k==='conv_sql_inv'?'ci':c.k==='conv_inv_paid'?'cp':c.k])+'</b></td>';
  });
  h += '</tr></tbody></table>';
  return h;
}

function renderBars(mgrs) {
  var slices = [
    { title: 'B2B vs B2C', items: [
      {k:'b2b_sum',label:'B2B',color:'#1f2a44'},
      {k:'b2c_sum',label:'B2C',color:'#00bcd4'},
    ]},
    { title: 'Источники (внутренняя база vs маркетинг)', items: [
      {k:'src_int_sum',label:'Внутренняя база',color:'#2e7d32'},
      {k:'src_mkt_sum',label:'Маркетинг',color:'#ff9800'},
    ]},
    { title: 'Форматы обучения', items: [
      {k:'fmt_oom_sum',label:'ООМ (Очное)',color:'#1565c0'},
      {k:'fmt_om_sum',label:'ОМ (Онлайн)',color:'#7b1fa2'},
      {k:'fmt_sdo_sum',label:'СДО',color:'#e65100'},
    ]},
  ];
  var h = '';
  slices.forEach(function(sl){
    h += '<div style="margin-bottom:24px">';
    h += '<h3 style="font-size:13px;margin-bottom:8px;color:#1f2a44">' + sl.title + '</h3>';
    mgrs.forEach(function(m){
      var total = 0;
      sl.items.forEach(function(it){ total += m[it.k] || 0; });
      if (total === 0) return;
      h += '<div style="display:flex;align-items:center;margin:3px 0;gap:8px">';
      h += '<span style="min-width:150px;font-size:11px;font-weight:600;text-align:right;flex-shrink:0">' + e(m.name) + '</span>';
      h += '<div style="flex:1;height:20px;background:#e2e8f0;border-radius:4px;overflow:hidden;display:flex">';
      sl.items.forEach(function(it){
        var val = m[it.k] || 0;
        var pct = val / total * 100;
        if (pct < 2) return;
        h += '<div style="width:' + pct.toFixed(1) + '%;height:100%;background:' + it.color + ';display:inline-block" title="' + it.label + ': ' + n(val) + ' руб (' + pct.toFixed(1) + '%)"></div>';
      });
      h += '</div>';
      h += '<span style="font-size:10px;color:#888;min-width:50px;flex-shrink:0;text-align:right">' + n(total) + ' руб</span>';
      h += '</div>';
    });
    h += '</div>';
  });
  return h;
}

load();

function loadFunnel() {
  var canvas = document.getElementById('funnelChart');
  if (!canvas || !window.Chart) return;
  fetch(BP+'/api/funnel').then(function(r){return r.json();}).then(function(d){
    var weeks = d.weeks || [];
    if (!weeks.length) return;
    var labels = weeks.map(function(w){ return w.label_dates || 'Неделя'+String(w.week).padStart(2,'0'); });
    new Chart(canvas, {
      type:'bar', data:{ labels:labels, datasets:[
        {label:'Отказы неКвал', data:weeks.map(function(w){return w.stack_rej_nq||0;}), backgroundColor:'#880E4F', borderRadius:4 },
        {label:'Отказы', data:weeks.map(function(w){return w.stack_rej||0;}), backgroundColor:'#E53935', borderRadius:4 },
        {label:'Не квал', data:weeks.map(function(w){return w.stack_nq||0;}), backgroundColor:'#FFD54F', borderRadius:4 },
        {label:'MQL', data:weeks.map(function(w){return w.stack_mql||0;}), backgroundColor:'#42A5F5', borderRadius:4 },
        {label:'SQL', data:weeks.map(function(w){return w.stack_sql||0;}), backgroundColor:'#1A237E', borderRadius:4 },
        {label:'Счёт', data:weeks.map(function(w){return w.stack_inv||0;}), backgroundColor:'#7E57C2', borderRadius:4 },
        {label:'Оплата', data:weeks.map(function(w){return w.stack_pay||0;}), backgroundColor:'#43A047', borderRadius:4 }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'top',labels:{font:{size:10}}}, datalabels:{display:false} },
        scales:{ x:{stacked:true}, y:{stacked:true,beginAtZero:true} }
      }
    });
  }).catch(function(){});
}

// --- Refresh button handler ---
document.addEventListener('click', async function(e) {
  if (!e.target || e.target.id !== 'refreshBtn') return;
  var btn = e.target;
  btn.disabled = true;
  btn.textContent = '\u23f3 Обновление...';

  try {
    await safeFetch((window.BASE_PATH || '') + '/api/refresh/reset', { method: 'POST' });
    var res = await safeFetch((window.BASE_PATH || '') + '/api/refresh', { method: 'POST' });
    if (!res.ok) { alert(res.message); return; }

    // Show progress panel
    var panel = document.getElementById('refreshStatusPanel');
    if (!panel) {
      var tb = document.querySelector('.toolbar');
      if (tb) tb.insertAdjacentHTML('afterend', statusPanelHTML);
      panel = document.getElementById('refreshStatusPanel');
    }
    if (panel) {
      panel.style.display = 'block';
      document.getElementById('statusProgressFill').style.width = '0%';
      document.getElementById('statusSteps').innerHTML = renderStepLines(-1, refreshStepsData, 0);
      document.getElementById('statusElapsed').textContent = '\u23f1 0\u043c 0\u0441';
      document.getElementById('statusDealProgress').textContent = '';
    }

    while (true) {
      await new Promise(r => setTimeout(r, 5000));
      var status = await safeFetch((window.BASE_PATH || '') + '/api/status');

      var elapsed = '';
      if (status.startedAt) {
        var start = new Date(status.startedAt);
        var now = new Date();
        var diff = Math.floor((now - start) / 1000);
        elapsed = Math.floor(diff / 60) + '\u043c ' + (diff % 60) + '\u0441';
        var elEl = document.getElementById('statusElapsed');
        if (elEl) elEl.textContent = '\u23f1 ' + elapsed;
      }

      var pct = status.progressPct != null ? status.progressPct : 0;
      var fillEl = document.getElementById('statusProgressFill');
      if (fillEl) fillEl.style.width = Math.min(pct, 100) + '%';

      var curIdx = status.currentStepIdx != null ? status.currentStepIdx : -1;
      if (status.progressSteps) {
        var allDone = status.progressSteps.every(function(s) { return s.done; });
        if (allDone) curIdx = refreshStepsData.length;
        var stepsEl = document.getElementById('statusSteps');
        if (stepsEl) stepsEl.innerHTML = renderStepLines(curIdx, status.progressSteps, pct);
      }

      if (status.error && !status.loading) {
        var stepsEl = document.getElementById('statusSteps');
        if (stepsEl) stepsEl.innerHTML += '<div class="refresh-step step-error"><span class="step-icon">\u274c</span><span class="step-label">\u041e\u0448\u0438\u0431\u043a\u0430: ' + status.error + '</span></div>';
        break;
      }
      if (status.ready && !status.loading) {
        var fillEl = document.getElementById('statusProgressFill');
        if (fillEl) fillEl.style.width = '100%';
        var stepsEl = document.getElementById('statusSteps');
        if (stepsEl) stepsEl.innerHTML = renderStepLines(refreshStepsData.length, refreshStepsData, 100);
        var dpEl = document.getElementById('statusDealProgress');
        if (dpEl) dpEl.textContent = '\u2705 \u0417\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043e \u0437\u0430 ' + elapsed;

        setTimeout(function() {
          var pnl = document.getElementById('refreshStatusPanel');
          if (pnl) pnl.style.display = 'none';
        }, 5000);

        load().catch(function(e) {});
        break;
      }
    }
  } catch(e) {
    if (e.message !== 'redirect') alert('\u041e\u0448\u0438\u0431\u043a\u0430: ' + e.message);
  }
  finally { btn.disabled = false; btn.textContent = '\ud83d\udd04 Обновить данные'; }
});
</script>
</body>
</html>
